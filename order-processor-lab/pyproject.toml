[project]
name = "order-processor-lab"
version = "0.1.0"
description = "Учебный проект: системная работа с GitHub Copilot и Context7 MCP"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "T20", "ANN"]

[tool.ruff.lint.per-file-ignores]
# Для тестов не требуем аннотации фикстур и т.п. — только базовые правила
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
